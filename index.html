<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#d94747" />
    <title>Study Pulse</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="mode-study">
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">個人用学習アシスタント</p>
          <h1>Study Pulse</h1>
        </div>
        <button id="installButton" class="install-btn hidden" type="button">ホーム画面へ追加</button>
      </header>

      <nav class="screen-tabs" aria-label="機能切り替え">
        <button class="screen-tab active" data-target="timer" type="button">タイマー</button>
        <button class="screen-tab" data-target="stats" type="button">分析</button>
      </nav>

      <main class="layout screen-feed" id="screenFeed">
        <section class="panel feature-screen active" data-screen="timer">
          <div id="modeBadge" class="mode-badge mode-study">勉強中</div>
          <div id="timerDisplay" class="timer-display">25:00</div>

          <div class="timer-actions">
            <button id="startPauseButton" class="primary" type="button">開始</button>
            <button id="resetButton" class="secondary" type="button">リセット</button>
            <button id="switchModeButton" class="secondary" type="button">休憩へ</button>
            <button id="alarmStopButton" class="danger hidden" type="button">止める</button>
          </div>

          <div class="duration-controls">
            <label>
              <span>勉強</span>
              <div class="field-with-unit">
                <input id="studyMinutesInput" type="number" min="1" max="180" value="25" />
                <span>分</span>
              </div>
            </label>
            <label>
              <span>休憩</span>
              <div class="field-with-unit">
                <input id="breakMinutesInput" type="number" min="1" max="120" value="5" />
                <span>分</span>
              </div>
            </label>
          </div>

          <div class="focus-tools">
            <label>
              <span>教科</span>
              <select id="timerSubjectSelect">
                <option value="">教科を選ぶ</option>
              </select>
            </label>
          </div>
        </section>

        <section class="panel feature-screen" data-screen="stats">
          <div class="section-head">
            <h2>分析</h2>
          </div>

          <div id="statsSummary" class="summary-stats"></div>
        </section>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
